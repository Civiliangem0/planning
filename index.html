<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DarkRP2 Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0c0c;
    --panel: #121313;
    --panel-hover: #1d1c15;
    --text: #d6d0bf;
    --muted: #8e8a7e;
    --title: #ecebe6;
    --accent: #c8b27a;
    --line: rgba(190, 180, 150, 0.22);
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--text); font: 15px/1.6 var(--body); padding-inline: 16px; padding-block: 48px 64px; }
  .page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; flex-direction: column; gap: 10px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); font-size: 14px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; font-size: clamp(38px, 7vw, 56px); color: var(--title); }
  p { margin: 0; max-width: 64ch; }
  .plans { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .plan { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: baseline; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: background-color 0.15s ease, border-color 0.15s ease; }
  .plan:hover, .plan:focus-visible { background: var(--panel-hover); border-color: rgba(200, 178, 122, 0.5); outline: none; }
  .plan b { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--title); }
  .plan .date { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .plan span.desc { grid-column: 1 / -1; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .plan { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">DarkRP2</div>
    <h1>Planning</h1>
    <p>Design plans for the game, agreed before anything is built.</p>
  </header>
  <ul class="plans">
    <li>
      <a class="plan" href="gunsmithing/">
        <b>Gunsmithing</b>
        <span class="date">27 Sep 2026</span>
        <span class="desc">Realistic gun crafting: machines, blueprint USBs, steel, CS2-style rarity, Tarkov wear and jams.</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
